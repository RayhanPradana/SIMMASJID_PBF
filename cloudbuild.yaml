steps:

  # Step 0: Install apache2, mysql-server, php-mysql, dan composer
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
    - 'compute'
    - 'ssh'
    - 'simmasjid-eka'
    - '--zone=asia-east1-a'
    - >-
      --command=bash -c "
      sudo apt-get update &&
      sudo apt-get install -y apache2 mysql-server php-mysql php-cli unzip curl &&
      EXPECTED_CHECKSUM=$$(php -r 'copy(\"https://composer.github.io/installer.sig\", \"php://stdout\");') &&
      php -r \"copy('https://getcomposer.org/installer', 'composer-setup.php');\" &&
      ACTUAL_CHECKSUM=$$(php -r \"echo hash_file('sha384', 'composer-setup.php');\") &&
      [ \"$$EXPECTED_CHECKSUM\" = \"$$ACTUAL_CHECKSUM\" ] &&
      sudo php composer-setup.php --install-dir=/usr/local/bin --filename=composer &&
      rm composer-setup.php &&
      sudo systemctl restart apache2
      "

  # Step 1: Git pull + safe.directory
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'compute'
      - 'ssh'
      - 'simmasjid-eka'
      - '--zone=asia-east1-a'
      - >-
        --command=bash -c "
        git config --global --add safe.directory /var/www/html/SIMMASJID_PBF_Deploy &&
        cd /var/www/html/SIMMASJID_PBF_Deploy &&
        git pull origin Optimization
        "

  # Step 2: Laravel dependency & artisan commands
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'compute'
      - 'ssh'
      - 'simmasjid-eka'
      - '--zone=asia-east1-a'
      - >-
        --command=bash -c "
        cd /var/www/html/SIMMASJID_PBF_Deploy &&
        composer install --no-interaction --prefer-dist &&
        php artisan migrate --force &&
        php artisan config:cache &&
        php artisan storage:link
        "

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'
