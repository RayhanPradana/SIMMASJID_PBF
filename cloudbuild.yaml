steps:

  # Step 0: Install mysqli (php-mysql) package
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
    - 'compute'
    - 'ssh'
    - 'simmasjid-eka'
    - '--zone=asia-east1-a'
    - >-
      --command=bash -c "
      sudo apt-get update &&
      sudo apt-get install -y apache2 mysql-server php-mysql &&
      sudo systemctl restart apache2
      "

  # Step 1: Git pull
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'compute'
      - 'ssh'
      - 'simmasjid-eka'
      - '--zone=asia-east1-a'
      - '--command=cd /var/www/html/SIMMASJID_PBF_Deploy && git pull origin Optimization'

  # Step 2: Install dependency dan artisan commands
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'compute'
      - 'ssh'
      - 'simmasjid-eka'
      - '--zone=asia-east1-a'
      - '--command=cd /var/www/html/SIMMASJID_PBF_Deploy && composer install --no-interaction --prefer-dist && php artisan migrate --force && php artisan config:cache && php artisan storage:link'

# Diletakkan di luar steps
options:
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'
