steps:

  # Step 0: Install apache2, mysql-server, php-mysql
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'compute'
      - 'ssh'
      - 'simmasjid-eka'
      - '--zone=asia-east1-a'
      - >-
        --command=bash -c "
        sudo apt-get update &&
        sudo apt-get install -y apache2 mysql-server php-mysql &&
        sudo systemctl restart apache2
        "

  # ✅ Step 1: Git pull dengan set safe.directory
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'compute'
      - 'ssh'
      - 'simmasjid-eka'
      - '--zone=asia-east1-a'
      - >-
        --command=bash -c "
        git config --global --add safe.directory /var/www/html/SIMMASJID_PBF_Deploy &&
        cd /var/www/html/SIMMASJID_PBF_Deploy &&
        git pull origin Optimization
        "

  # Step 2: Install dependency dan artisan command
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'compute'
      - 'ssh'
      - 'simmasjid-eka'
      - '--zone=asia-east1-a'
      - >-
        --command=bash -c "
        cd /var/www/html/SIMMASJID_PBF_Deploy &&
        composer install --no-interaction --prefer-dist &&
        php artisan migrate --force &&
        php artisan config:cache &&
        php artisan storage:link
        "

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'
